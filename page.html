<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
    <title>Page - Shukdev Dhakal</title>
</head>

<body>
    <!-- HEADER SECTION -->
    <header class="header">
        <a href="index.html#home" class="logo">Shukdev dhakal</a>
        <i class='bx bx-menu' id="menu-icon"></i>
        <nav class="navbar">
            <a href="index.html#home">Home</a>
            <a href="about.html">About</a>
            <a href="documents.html">Documents</a>
            <a href="contact-me.html">Contact Me</a>
            <a href="privacy-policy.html">Privacy Policy</a>
            <a href="login.html" class="nav-login-btn"><i class='bx bx-user'></i> Login</a>
        </nav>
    </header>

    <!-- DYNAMIC PAGE CONTENT SECTION -->
    <section class="content-section" id="dynamicPageContainer">
        <!-- Rendered dynamically -->
        <div style="text-align:center;padding:5rem 0;">
            <i class='bx bx-loader-alt bx-spin' style="font-size:3rem;color:var(--main-color);"></i>
            <p style="font-size:1.6rem;margin-top:1rem;">Loading page content...</p>
        </div>
    </section>

    <!-- FOOTER SECTION -->
    <footer class="footer">
        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="documents.html">Documents</a>
            <a href="contact-me.html">Contact</a>
            <a href="privacy-policy.html">Privacy Policy</a>
            <a href="privacy-policy-daure.html">Privacy - Daure</a>
            <a href="terms.html">Terms & Agreement</a>
            <a href="login.html">Admin Login</a>
        </div>
        <div class="social">
            <a href="https://www.facebook.com/shukdev.dhakal.3" target="_blank"><i class='bx bxl-facebook'></i></a>
            <a href="https://instagram.com/shukdevdhakal007" target="_blank"><i class='bx bxl-instagram'></i></a>
            <a href="https://play.google.com/store/apps/details?id=com.bank.damodardhakal&hl=ne" target="_blank"><i class='bx bxl-play-store'></i></a>
        </div>
        <p class="copyright">© Damodar Dhakal - All Rights Reserved</p>
    </footer>

    <script src="script.js"></script>
    <script src="cms.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadPage();
        });

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        function loadPage() {
            const pageId = getQueryParam('id') || getQueryParam('slug');
            const container = document.getElementById('dynamicPageContainer');

            if (!pageId) {
                renderAllPagesList(container);
                return;
            }

            const page = CMS.getPageBySlugOrId(pageId);
            if (!page) {
                container.innerHTML = `
                    <div style="text-align:center;padding:6rem 2rem;">
                        <i class='bx bx-error-circle' style="font-size:5rem;color:#d32f2f;"></i>
                        <h2 style="font-size:3rem;margin:1.5rem 0 1rem;">Page Not Found</h2>
                        <p style="font-size:1.6rem;color:#666;max-width:50rem;margin:0 auto 2.5rem;">
                            The page or article you are looking for does not exist or may have been removed.
                        </p>
                        <a href="index.html" class="btn"><i class='bx bx-home'></i> Return Home</a>
                        <a href="documents.html" class="btn" style="margin-left:1rem;"><i class='bx bx-folder'></i> View Documents</a>
                    </div>
                `;
                return;
            }

            document.title = page.title + " - Shukdev Dhakal";

            const isAdmin = CMS.isAuthenticated();
            const allPages = CMS.getPages().filter(p => p.id !== page.id);

            container.innerHTML = `
                <div class="page-view-wrapper" style="max-width: 90rem; margin: 0 auto;">
                    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;margin-bottom:2rem;">
                        <div class="page-meta-header">
                            <span style="background:var(--main-color);color:#fff;padding:0.4rem 1.4rem;border-radius:2rem;font-size:1.3rem;font-weight:600;">
                                ${escapeHtml(page.category || 'Article')}
                            </span>
                            <span style="font-size:1.4rem;color:#666;margin-left:1.5rem;">
                                <i class='bx bx-calendar'></i> ${page.publishedDate || 'Published'}
                            </span>
                            <span style="font-size:1.4rem;color:#666;margin-left:1.5rem;">
                                <i class='bx bx-user'></i> ${escapeHtml(page.author || 'Shukdev Dhakal')}
                            </span>
                        </div>
                        ${isAdmin ? `
                            <a href="admin.html#pages" class="btn btn-sm" style="padding:0.6rem 1.4rem;font-size:1.3rem;">
                                <i class='bx bx-edit'></i> Edit in Admin
                            </a>
                        ` : ''}
                    </div>

                    <h1 class="heading" style="text-align:left;font-size:4rem;line-height:1.2;margin-bottom:1.5rem;color:var(--text-color);">
                        ${escapeHtml(page.title)}
                    </h1>

                    ${page.subtitle ? `
                        <p style="font-size:2rem;color:#444;line-height:1.5;margin-bottom:3rem;font-style:italic;border-left:4px solid var(--main-color);padding-left:1.5rem;">
                            ${escapeHtml(page.subtitle)}
                        </p>
                    ` : ''}

                    <hr style="border:none;border-top:1px solid #ddd;margin-bottom:3rem;">

                    <div class="page-body-content" style="font-size:1.7rem;line-height:1.9;color:#222;">
                        ${page.content}
                    </div>

                    <div style="margin-top:5rem;padding-top:2rem;border-top:1px solid #eee;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1.5rem;">
                        <div>
                            <a href="index.html" class="btn"><i class='bx bx-arrow-back'></i> Home</a>
                            <a href="documents.html" class="btn" style="margin-left:1rem;"><i class='bx bx-file'></i> Documents</a>
                        </div>
                        <button class="btn btn-outline" onclick="copyPageLink()">
                            <i class='bx bx-share-alt'></i> Share Page Link
                        </button>
                    </div>

                    ${allPages.length > 0 ? `
                        <div style="margin-top:6rem;background:var(--snd-bg-color);padding:3rem;border-radius:1.5rem;">
                            <h3 style="font-size:2.2rem;margin-bottom:1.5rem;color:var(--main-color);">
                                <i class='bx bx-collection'></i> More Articles & Pages
                            </h3>
                            <ul style="list-style:none;margin:0;padding:0;">
                                ${allPages.map(ap => `
                                    <li style="margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid rgba(0,0,0,0.06);">
                                        <a href="page.html?id=${encodeURIComponent(ap.slug || ap.id)}" style="font-size:1.6rem;font-weight:600;color:var(--text-color);text-decoration:none;">
                                            <i class='bx bx-chevron-right' style="color:var(--main-color);"></i> ${escapeHtml(ap.title)}
                                        </a>
                                        <span style="font-size:1.3rem;color:#666;margin-left:1rem;">(${escapeHtml(ap.category || 'General')})</span>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderAllPagesList(container) {
            const pages = CMS.getPages();
            container.innerHTML = `
                <div style="max-width:85rem;margin:0 auto;">
                    <h2 class="heading">Articles & <span>Pages</span></h2>
                    <p style="font-size:1.7rem;margin-bottom:3rem;color:#555;">Browse all published educational articles, announcements, and resources.</p>
                    <div style="display:flex;flex-direction:column;gap:1.5rem;">
                        ${pages.map(p => `
                            <div style="background:var(--bg-color);border:2px solid #e0e0e0;border-radius:1.2rem;padding:2rem;transition:0.3s;box-shadow:0 3px 10px rgba(0,0,0,0.04);">
                                <span style="background:var(--snd-bg-color);color:var(--main-color);padding:0.3rem 1rem;border-radius:1rem;font-size:1.2rem;font-weight:600;">${escapeHtml(p.category || 'Article')}</span>
                                <h3 style="font-size:2.2rem;margin:1rem 0 0.5rem;"><a href="page.html?id=${encodeURIComponent(p.slug || p.id)}" style="color:var(--text-color);">${escapeHtml(p.title)}</a></h3>
                                ${p.subtitle ? `<p style="font-size:1.5rem;color:#666;margin-bottom:1rem;">${escapeHtml(p.subtitle)}</p>` : ''}
                                <a href="page.html?id=${encodeURIComponent(p.slug || p.id)}" class="btn btn-sm" style="margin-top:0.5rem;">Read Full Page <i class='bx bx-right-arrow-alt'></i></a>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function copyPageLink() {
            navigator.clipboard.writeText(window.location.href);
            alert('Page link copied to clipboard!');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>

</html>
