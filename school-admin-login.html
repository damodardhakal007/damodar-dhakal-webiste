<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>Admin Login - Kavresthali Secondary School</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a192f 0%, #112240 50%, #1a365d 100%);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 127, 115, 0.1) 0%, transparent 50%);
            animation: rotate 30s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            padding: 4rem 3.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
        }

        .login-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .login-header .school-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #007F73, #00b3a1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin: 0 auto 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 127, 115, 0.3);
        }

        .login-header h1 {
            color: #fff;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.3rem;
        }

        .form-group {
            margin-bottom: 2rem;
            position: relative;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.3rem;
            margin-bottom: 0.8rem;
            font-weight: 500;
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group .input-wrapper i {
            position: absolute;
            left: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.8rem;
        }

        .form-group input {
            width: 100%;
            padding: 1.4rem 1.5rem 1.4rem 4.5rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 1rem;
            color: #fff;
            font-size: 1.4rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #007F73;
            background: rgba(0, 127, 115, 0.1);
            box-shadow: 0 0 20px rgba(0, 127, 115, 0.2);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .login-btn {
            width: 100%;
            padding: 1.5rem;
            background: linear-gradient(135deg, #007F73, #00b3a1);
            border: none;
            border-radius: 1rem;
            color: #fff;
            font-size: 1.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 127, 115, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 1.2rem;
            text-align: center;
            margin-top: 1.5rem;
            display: none;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 2rem;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 1.3rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #007F73;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 2rem;
                padding: 3rem 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <div class="school-icon">🎓</div>
            <h1>Admin Login</h1>
            <p>Kavresthali Secondary School</p>
        </div>

        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <div class="input-wrapper">
                    <i class='bx bx-user'></i>
                    <input type="text" id="username" placeholder="Enter username" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class='bx bx-lock-alt'></i>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="login-btn">
                <i class='bx bx-log-in'></i> Sign In
            </button>

            <div class="error-msg" id="errorMsg">
                ❌ Invalid username or password. Please try again.
            </div>
        </form>

        <a href="kavresthali_school_website.html" class="back-link">← Back to School Website</a>
    </div>

    <script>
        // Check if already logged in
        if (localStorage.getItem('kss_admin_logged_in') === 'true') {
            window.location.href = 'school-admin-dashboard.html';
        }

        function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Credentials - check localStorage for changed password
            const validUsername = 'damodardhakal007';
            const validPassword = localStorage.getItem('kss_admin_password') || 'damodardhakal007';

            if (username === validUsername && password === validPassword) {
                localStorage.setItem('kss_admin_logged_in', 'true');
                window.location.href = 'school-admin-dashboard.html';
            } else {
                const errorMsg = document.getElementById('errorMsg');
                errorMsg.style.display = 'block';
                setTimeout(() => {
                    errorMsg.style.display = 'none';
                }, 3000);
            }

            return false;
        }
    </script>
</body>

</html>
