<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Admin Login - Kavresthali Secondary School</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0D3B0F 0%, #1B5E20 40%, #2E7D32 100%);
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(76, 175, 80, 0.08) 0%, transparent 50%);
            animation: rotate 40s linear infinite;
        }
        body::after {
            content: '';
            position: absolute;
            bottom: -30%;
            right: -30%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(255, 111, 0, 0.06) 0%, transparent 50%);
            animation: rotate 30s linear infinite reverse;
        }
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-container {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 2.5rem;
            padding: 4rem 3.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
        }

        .login-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        .login-header .school-icon {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #1B5E20, #4CAF50);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            margin: 0 auto 1.5rem;
            box-shadow: 0 10px 30px rgba(27, 94, 32, 0.3);
        }
        .login-header h1 {
            color: #1B5E20;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }
        .login-header .school-name {
            color: #666;
            font-size: 1.3rem;
            font-weight: 400;
        }
        .login-header .divider {
            width: 50px;
            height: 3px;
            background: linear-gradient(to right, #1B5E20, #4CAF50);
            margin: 1.2rem auto 0;
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 2rem;
            position: relative;
        }
        .form-group label {
            display: block;
            color: #333;
            font-size: 1.3rem;
            margin-bottom: 0.8rem;
            font-weight: 600;
        }
        .form-group .input-wrapper {
            position: relative;
        }
        .form-group .input-wrapper i {
            position: absolute;
            left: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            color: #9E9E9E;
            font-size: 1.8rem;
            transition: color 0.3s;
        }
        .form-group input {
            width: 100%;
            padding: 1.4rem 1.5rem 1.4rem 4.5rem;
            background: #F5F5F5;
            border: 2px solid #E0E0E0;
            border-radius: 1rem;
            color: #333;
            font-size: 1.4rem;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }
        .form-group input:focus {
            border-color: #4CAF50;
            background: #F1F8E9;
            box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.1);
        }
        .form-group input:focus + i,
        .form-group input:focus ~ i {
            color: #1B5E20;
        }
        .form-group input::placeholder {
            color: #BDBDBD;
        }

        .login-btn {
            width: 100%;
            padding: 1.5rem;
            background: linear-gradient(135deg, #1B5E20, #4CAF50);
            border: none;
            border-radius: 1rem;
            color: #fff;
            font-size: 1.5rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(27, 94, 32, 0.4);
        }
        .login-btn:active {
            transform: translateY(0);
        }

        .error-msg {
            color: #D32F2F;
            font-size: 1.3rem;
            text-align: center;
            margin-top: 1.5rem;
            display: none;
            animation: shake 0.5s ease;
            background: #FFEBEE;
            padding: 1rem;
            border-radius: 0.8rem;
            border: 1px solid #FFCDD2;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .back-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2.5rem;
            color: #666;
            text-decoration: none;
            font-size: 1.3rem;
            transition: color 0.3s;
            padding-top: 2rem;
            border-top: 1px solid #E0E0E0;
        }
        .back-link:hover {
            color: #1B5E20;
        }

        .secure-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
            font-size: 1.1rem;
            color: #9E9E9E;
        }
        .secure-badge i {
            color: #4CAF50;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 2rem;
                padding: 3rem 2rem;
            }
            .login-header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <div class="school-icon">🎓</div>
            <h1>Admin Panel</h1>
            <div class="school-name">Kavresthali Secondary School</div>
            <div class="divider"></div>
        </div>

        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="Enter admin username" required>
                    <i class='bx bx-user'></i>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Enter password" required>
                    <i class='bx bx-lock-alt'></i>
                </div>
            </div>

            <button type="submit" class="login-btn">
                <i class='bx bx-log-in'></i> Sign In to Dashboard
            </button>

            <div class="error-msg" id="errorMsg">
                ❌ Invalid username or password. Please try again.
            </div>

            <div class="secure-badge">
                <i class='bx bx-shield-quarter'></i> Secure Admin Access
            </div>
        </form>

        <a href="kavresthali_school_website.html" class="back-link">
            <i class='bx bx-arrow-back'></i> Back to School Website
        </a>
    </div>

    <script>
        // Check if already logged in
        if (localStorage.getItem('kss_admin_logged_in') === 'true') {
            window.location.href = 'school-admin-dashboard.html';
        }

        function handleLogin(event) {
            event.preventDefault();

            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;

            // Credentials
            var validUsername = 'damodardhakal007';
            var validPassword = localStorage.getItem('kss_admin_password') || 'damodardhakal007';

            if (username === validUsername && password === validPassword) {
                localStorage.setItem('kss_admin_logged_in', 'true');
                window.location.href = 'school-admin-dashboard.html';
            } else {
                var errorMsg = document.getElementById('errorMsg');
                errorMsg.style.display = 'block';
                setTimeout(function() {
                    errorMsg.style.display = 'none';
                }, 3000);
            }

            return false;
        }
    </script>
</body>
</html>
